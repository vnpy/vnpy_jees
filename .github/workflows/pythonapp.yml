name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          pip install "mypy==1.19.1" "ruff==0.14.1" pytest meson-python meson ninja pybind11

      - name: Install ta-lib
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install "ta-lib==0.6.4" --index-url https://pypi.vnpy.com
          else
            python -m pip install "ta-lib==0.6.4"
          fi
          python -m pip install "vnpy==4.4.0"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy vnpy_jees

      - name: Build and install
        run: |
          # Jees 与 CTP 都会加载 thosttraderapi_se.dll，不要在这个作业里安装 vnpy_ctp。
          pip install -e . --no-deps --no-build-isolation --config-settings=build-dir=build

      - name: Import extension
        run: python -c "import vnpy_jees.api"

      - name: Test
        run: python -m pytest tests
